<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OHT Accounting System</title>
<meta name="theme-color" content="#2A2620">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="icons/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Accounting">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#1F2933; --slate:#3E4C59; --mute:#7B8794; --line:#CBD2D9; --hair:#E4E7EB;
    --paper:#FFFFFF; --desk:#DDE1E6; --panel:#F5F7F8;
    --debit:#9B2C2C; --credit:#14614A; --accent:#A67C2E; --cash:#0B6E99;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body { font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
         background:var(--desk); color:var(--ink); display:flex; flex-direction:column; }
  button { font:inherit; cursor:pointer; }

  .nav { flex:none; background:var(--ink); color:#fff; display:flex; align-items:center;
         gap:4px; padding:0 8px; height:calc(46px + env(safe-area-inset-top));
         padding-top:env(safe-area-inset-top); }
  .mark { flex:none; width:26px; height:26px; border:1.5px solid var(--accent); border-radius:5px;
          display:grid; place-items:center; font-size:9.5px; color:var(--accent);
          font-weight:700; letter-spacing:.3px; margin-right:5px; }
  .navs { flex:1; display:flex; gap:2px; min-width:0; overflow-x:auto; scrollbar-width:none; }
  .navs::-webkit-scrollbar { display:none; }
  .nb { flex:none; background:none; border:none; color:#9AA5B1; padding:8px 13px;
        font-size:13.5px; font-weight:600; border-radius:7px; white-space:nowrap;
        position:relative; }
  .nb:hover { color:#DDE1E6; background:#2C3742; }
  .nb.on { color:#fff; background:#2C3742; }
  .nb.on::after { content:''; position:absolute; left:13px; right:13px; bottom:3px;
                  height:2px; border-radius:2px; background:var(--accent); }
  .out { flex:none; background:#2C3742; border:1px solid #3E4C59; color:#DDE1E6;
         border-radius:7px; padding:6px 10px; font-size:12px; font-weight:500; margin-left:4px; }
  .out:hover { background:#374350; }
  #rl { font-size:15px; padding:5px 9px; line-height:1; }

  .stage { flex:1; min-height:0; position:relative; background:var(--desk); }
  .stage iframe { position:absolute; inset:0; width:100%; height:100%; border:none;
                  display:none; background:var(--desk); }
  .stage iframe.on { display:block; }

  .boot { position:absolute; inset:0; display:grid; place-items:center; padding:24px;
          text-align:center; color:var(--mute); font-size:13.5px; line-height:1.6; }
  .boot .sp { width:22px; height:22px; margin:0 auto 12px; border:2.5px solid var(--line);
              border-top-color:var(--slate); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .ask { position:fixed; inset:0; z-index:50; background:rgba(31,41,51,.45); display:none;
         align-items:center; justify-content:center; padding:22px; }
  .ask.on { display:flex; }
  .ask .box { background:var(--paper); border-radius:12px; padding:20px; width:100%; max-width:360px;
              box-shadow:0 10px 34px rgba(0,0,0,.26); }
  .ask h4 { margin:0 0 7px; font-size:15.5px; font-weight:600; }
  .ask p { margin:0 0 17px; font-size:13.5px; color:var(--slate); line-height:1.55; }
  .ask .acts { display:flex; gap:8px; justify-content:flex-end; }
  .btn { border:1px solid var(--line); background:var(--paper); border-radius:8px;
         padding:9px 14px; font-size:13.5px; font-weight:600; }
  .btn:hover { background:var(--panel); }
  .btn.dgr { color:var(--debit); border-color:#E6CFCF; }
  .btn.dgr:hover { background:#FDF3F3; }

  @media (max-width:520px) {
    .nb { padding:8px 11px; font-size:13px; }
    .out { padding:6px 9px; font-size:11.5px; }
  }
  @media (prefers-reduced-motion:reduce) { .boot .sp { animation:none; } }
</style>
</head>
<body>

<div class="nav">
  <span class="mark" id="brandMark"></span>
  <div class="navs" id="navs"></div>
  <button class="out" id="installBtn" style="display:none">⭳ Install</button>
  <button class="out" id="rl" title="Update — naya version aur naye icons">⟳</button>
  <button class="out" id="out">Sign out</button>
</div>

<!-- AHEM: yahan "display" sirf EK dafa likha jaye. Pehle "display:none" ke baad
     "display:flex" bhi likha tha — CSS mein aakhri wala jeetta hai, is liye banner
     HAMESHA dikhta tha, chahe koi update ho ya na ho. Banda "Update karein" dabata,
     safha reload hota, aur banner phir wahin. Dikhane ka kaam JS karta hai. -->
<div id="updateBanner" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:#2A2620;color:#F5F1E6;padding:10px 16px;align-items:center;gap:12px;font-size:13px;font-family:'IBM Plex Sans',sans-serif">
  <span style="flex:1">Naya version available hai.</span>
  <button id="updateNowBtn" style="background:#B0824A;color:#2A2620;border:none;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600">Update karein</button>
  <button id="updateLaterBtn" style="background:none;color:#D9CFBE;border:none;padding:7px 10px;font-size:13px">Baad mein</button>
</div>

<div class="stage" id="stage">
  <div class="boot" id="boot"><div><div class="sp"></div>Opening…</div></div>
</div>

<div class="ask" id="ask">
  <div class="box">
    <h4>Sign out?</h4>
    <p>You will need your email and password to get back in. This signs you out of every screen.</p>
    <label id="askCheckWrap" style="display:flex;align-items:center;gap:8px;font-size:13px;
      margin:2px 0 12px;line-height:1.4;opacity:.85">
      <input type="checkbox" id="askCheck" style="flex:none">
      <span>Is device par mehfooz data bhi mita dein (bina bheji hui entries samet)</span>
    </label>
    <div class="acts">
      <button class="btn" id="askNo">Cancel</button>
      <button class="btn dgr" id="askYes">Sign out</button>
    </div>
  </div>
</div>

<script src="app-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  var APP = window.APP_CONFIG;
  $('brandMark').textContent = APP.mark;
  document.title = APP.appName;

  var APPS = [
    { k:'ledger',  label:'Ledger',  file:'client1-daily-ledger.html' },
    { k:'masters', label:'Masters', file:'client1-masters.html' },
    { k:'billing', label:'Billing', file:'client1-billing.html' },
    { k:'cutting', label:'Cutting', file:'client1-cutting.html' }
  ];

  var updating = false;   // poora update chal raha hai?

  /* Update ke foran baad banner dobara na dikhe. Warna banda samajhta hai
     ke button kaam hi nahi kar raha — dabata rehta hai aur safha bar bar
     refresh hota rehta hai. Waqai nayi shakl aayi to banner thori der
     baad khud wapas aa jayega. */
  function markUpdated() {
    try { sessionStorage.setItem(APP.key('just-updated'), String(Date.now())); } catch (e) {}
  }
  function updatedJustNow() {
    try { return Date.now() - (+sessionStorage.getItem(APP.key('just-updated')) || 0) < 30000; }
    catch (e) { return false; }
  }

  /* ---------- PWA: Service Worker + Install + Update ---------- */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      // Naya SW "waiting" state mein aa jaye to banner dikhado — user ki
      // marzi se hi activate hoga, kabhi khud-ba-khud bill-likhte waqt reload nahi
      function showUpdateBannerIfWaiting() {
        if (reg.waiting && !updatedJustNow()) $('updateBanner').style.display = 'flex';
      }
      showUpdateBannerIfWaiting();
      reg.addEventListener('updatefound', function () {
        var newSW = reg.installing;
        if (!newSW) return;
        newSW.addEventListener('statechange', function () {
          if (newSW.state === 'installed' && navigator.serviceWorker.controller
              && !updatedJustNow()) {
            $('updateBanner').style.display = 'flex';
          }
        });
      });
    }).catch(function () {});

    var refreshedOnce = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (updating || refreshedOnce) return;   // apna update chal raha ho to
      refreshedOnce = true;                    // reload hum khud karenge, yahan nahi
      location.reload();
    });
  }

  /* ---------- Poora update: naya code AUR naye icons ----------

     Sirf reload karne se icon nahi badalta — browser purana icon apne paas
     rakh leta hai. Is liye teen kaam ek saath karne parte hain:

       1. Service worker ke saare cache mita do
       2. Icon aur manifest ke <link> dobara lagao, naye pate ke saath
          (sirf href badalna kaafi nahi — poora tag badalna parta hai,
           warna browser dobara mangwata hi nahi)
       3. Naya service worker foran chalao, phir poora safha taaza

     HOME SCREEN ka icon phir bhi is se nahi badlega. Wo install ke waqt
     phone apne andar copy kar leta hai — us par kisi website ka ikhtiyar
     nahi. Android manifest dobara parh kar (aam tor par ek din mein) khud
     badal deta hai; iPhone par app hata kar dobara "Add to Home Screen"
     karna parta hai. Yeh browser ki hadd hai, is app ki kami nahi.

     Isi liye manifest mein har icon ka pata "?v=" ke saath likha hai —
     icon badle to yeh number badalta hai, Android ko nayi shakl nazar
     aati hai aur wo khud update kar leta hai. */

  function refreshIconLinks() {
    var v = Date.now();
    var links = document.querySelectorAll(
      'link[rel~="icon"], link[rel="apple-touch-icon"], link[rel="manifest"]');
    Array.prototype.forEach.call(links, function (l) {
      var href = (l.getAttribute('href') || '').split('?')[0];
      if (!href) return;
      var fresh = l.cloneNode(true);
      fresh.setAttribute('href', href + '?v=' + v);
      l.parentNode.replaceChild(fresh, l);
    });
  }

  function clearAllCaches() {
    if (!window.caches || !caches.keys) return Promise.resolve();
    return caches.keys().then(function (names) {
      return Promise.all(names.map(function (n) { return caches.delete(n); }));
    }).catch(function () {});
  }

  function activateNewWorker() {
    if (!('serviceWorker' in navigator)) return Promise.resolve();
    return navigator.serviceWorker.getRegistration().then(function (reg) {
      if (!reg) return;

      function wake(sw) { if (sw) { try { sw.postMessage('SKIP_WAITING'); } catch (e) {} } }

      /* AHEM — yahi wo ghalti thi jis se Update ka button "kaam hi nahi
         karta" lagta tha:

         reg.update() poora hone ka matlab yeh NAHI ke naya worker tayyar
         ho gaya. Wo aksar us waqt abhi "installing" hota hai aur
         reg.waiting khali hoti hai. Purana code us khali waiting ko dekh
         kar SKIP_WAITING bhejta hi nahi tha — purana worker qabza kiye
         baitha rehta, reload ke baad banner phir aa jata, aur banda
         dabata rehta.

         Ab hum us ke "installed" hone ka intezar karte hain, phir kehte
         hain. */
      function whenReady() {
        if (reg.waiting) { wake(reg.waiting); return Promise.resolve(); }
        var sw = reg.installing;
        if (!sw) return Promise.resolve();          // kuch naya hai hi nahi
        return new Promise(function (ready) {
          sw.addEventListener('statechange', function onChange() {
            if (sw.state === 'installed') {
              sw.removeEventListener('statechange', onChange);
              wake(reg.waiting || sw); ready();
            } else if (sw.state === 'activated' || sw.state === 'redundant') {
              sw.removeEventListener('statechange', onChange);
              ready();
            }
          });
        });
      }

      return Promise.resolve(reg.update()).catch(function () {}).then(whenReady);
    }).catch(function () {});
  }

  function fullUpdate() {
    if (updating) return;
    updating = true;

    var btn = $('rl');
    btn.disabled = true; btn.textContent = '\u2026';
    $('updateBanner').style.display = 'none';

    var done = false;
    function finish() {
      if (done) return; done = true;
      markUpdated();      // reload ke baad banner foran dobara na aaye
      location.replace(location.pathname + '?v=' + Date.now() + location.hash);
    }
    // internet dheema ho ya kuch atak jaye to bhi app phansi na rahe
    setTimeout(finish, 8000);

    // naya worker qabza le le — yehi asal nishani hai ke update ho gaya
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        setTimeout(finish, 200);
      });
    }

    refreshIconLinks();
    Promise.all([clearAllCaches(), activateNewWorker()])
      .then(function () { setTimeout(finish, 1200); })
      .catch(function () { finish(); });
  }

  $('updateNowBtn').addEventListener('click', fullUpdate);
  $('updateLaterBtn').addEventListener('click', function () {
    $('updateBanner').style.display = 'none';
  });

  // Install button — sirf tab dikhao jab browser ne mauka diya ho, aur
  // agar app pehle se installed hai to kabhi mat dikhao
  var deferredInstallPrompt = null;
  function alreadyInstalled() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  if (!alreadyInstalled()) {
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredInstallPrompt = e;
      $('installBtn').style.display = '';
    });
  }
  $('installBtn').addEventListener('click', function () {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(function () {
      deferredInstallPrompt = null;
      $('installBtn').style.display = 'none';
    });
  });
  window.addEventListener('appinstalled', function () { $('installBtn').style.display = 'none'; });

  /* khud ko dekho — GitHub par nayi shakl aa gayi ho to foran badal jao.
     Sirf meta tag par bharosa nahi, browser use aksar nazarandaz karta hai. */
  var VERSION = '61';
  (function selfCheck() {
    if (!window.fetch) return;
    // AHEM: yahan pehle root wali index.html mangwai jati thi — magar wo to
    // sirf redirect ka safha hai, us mein VERSION hai hi nahi. Is liye yeh
    // jaanch kabhi chali hi nahi. Ab shell apni hi file dekhti hai.
    var here = location.pathname.replace(/[^/]*$/, '') + 'client1-index.html';
    fetch(here + '?probe=' + Date.now(), { cache:'no-store' })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (t) {
        if (!t) return;
        var m = t.match(/var VERSION = '([^']+)'/);
        if (m && m[1] !== VERSION && !/[?&]v=/.test(location.search)) {
          location.replace(location.pathname + '?v=' + Date.now() + location.hash);
        }
      })
      .catch(function () {});
  })();

  var frames = {}, current = null;

  // browser andar wali file ko yaad rakh leta hai — is nishaan se rozana taazi mangwao
  function stamp() {
    var d = new Date();
    // VERSION ke saath bandha hua — jab shell nayi hoti hai, saari app bhi nayi aati hain
    return VERSION + '-' + d.getFullYear() + '' + (d.getMonth() + 1) + '' + d.getDate();
  }
  // "?v=" shell ke apne pate se — Update dabate hi poora safha naye nishaan
  // ke saath khulta hai, is liye chaaron apps bhi apne aap nayi aa jati hain
  var bust = (/[?&]v=(\d+)/.exec(location.search) || [])[1] || stamp();

  /* ---------- nav ---------- */
  APPS.forEach(function (a) {
    var b = document.createElement('button');
    b.className = 'nb'; b.textContent = a.label; b.setAttribute('data-k', a.k);
    b.addEventListener('click', function () { go(a.k, true); });
    $('navs').appendChild(b);
  });

  function go(key, push) {
    var app = APPS.filter(function (a) { return a.k === key; })[0];
    if (!app) app = APPS[0], key = app.k;
    if (current === key) return;

    // pehli dafa khul rahi hai to iframe banao; warna jo bani hui hai wohi dikhao
    if (!frames[key]) {
      var f = document.createElement('iframe');
      f.src = app.file + '?v=' + bust;
      f.title = app.label;
      f.addEventListener('load', function () {
        $('boot').style.display = 'none';
        try { f.contentWindow.postMessage({ msg:'active', on:(current === key) }, '*'); } catch (e) {}
        if (pending[key]) { deliver(key, pending[key]); delete pending[key]; }
      });
      $('stage').appendChild(f);
      frames[key] = f;
      $('boot').style.display = '';
    } else {
      $('boot').style.display = 'none';
    }

    Object.keys(frames).forEach(function (k) {
      frames[k].classList.toggle('on', k === key);
      // Session ka refresh sirf khuli hui app kare — warna chaaron ek saath
      // token refresh kar ke ek doosre ka session tor deti hain
      try { frames[k].contentWindow.postMessage({ msg:'active', on:(k === key) }, '*'); } catch (e) {}
    });
    document.querySelectorAll('.nb').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-k') === key);
    });
    current = key;
    document.title = app.label + ' \u2014 ' + APP.appName;
    try { store(APP.key('tab'), key); } catch (e) {}
    if (push) {
      try { history.replaceState(null, '', '#' + key); } catch (e) {}
    }
  }

  /* ek app doosri ko bulaye — masters se bill ya us din ki sheet kholna */
  var pending = {};
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m) return;
    if (m.msg === 'open' && m.app) {
      var known = APPS.filter(function (a) { return a.k === m.app; })[0];
      if (!known) return;
      var fresh = !frames[m.app];
      go(m.app, true);
      if (fresh) { pending[m.app] = m.arg || ''; return; }      // abhi khul rahi hai — load par bhejenge
      deliver(m.app, m.arg || '');
      return;
    }
    if (m.msg === 'refresh' && m.kind) {
      // aik app ne data badla — baaqi khuli apps ko khabar kar do, khud data mangwa lein
      Object.keys(frames).forEach(function (k) {
        var f = frames[k];
        if (f && f.contentWindow && f.contentWindow !== e.source) {
          try { f.contentWindow.postMessage({ msg:'refresh', kind:m.kind }, '*'); } catch (err) {}
        }
      });
    }
  });
  function deliver(app, arg) {
    var f = frames[app];
    if (!f || !f.contentWindow) return;
    try { f.contentWindow.postMessage({ msg:'goto', arg:arg }, '*'); } catch (e) {}
  }

  function store(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }
    catch (e) { return null; }
  }

  window.addEventListener('hashchange', function () {
    var k = (location.hash || '').replace('#', '');
    if (k) go(k, false);
  });

  /* ---------- sign out ---------- */
  $('rl').addEventListener('click', fullUpdate);
  $('out').addEventListener('click', function () { $('ask').classList.add('on'); });
  $('askNo').addEventListener('click', function () { $('ask').classList.remove('on'); });
  /* Is device par mehfooz data mitana — offline queue, cache, aur Daily
     Ledger ki sheets. Supabase ka connection (cfg) rehne dete hain,
     taake agla banda seedha login kar sake.

     Yeh shell ka sign out saare screens ko band karta hai, is liye
     safai bhi yahin sab ke liye ek saath ho jati hai — chaaron apps ek
     hi localStorage istemaal karti hain. */
  function clearDeviceData() {
    var keep = APP.key('cfg'), prefix = window.APP_CONFIG.storeKey + '-';
    try {
      Object.keys(window.localStorage).forEach(function (k) {
        if (k === keep) return;
        if (k.indexOf(prefix) === 0 || k === 'ledger-app-pk') {
          window.localStorage.removeItem(k);
        }
      });
    } catch (e) {}
  }

  $('askYes').addEventListener('click', function () {
    $('askYes').disabled = true; $('askYes').textContent = 'Signing out…';
    if ($('askCheck').checked) clearDeviceData();
    var raw = store(APP.key('cfg')), done = function () { location.reload(); };
    if (!raw) { done(); return; }
    var cfg; try { cfg = JSON.parse(raw); } catch (e) { cfg = null; }
    if (!cfg || !cfg.url || !cfg.key || !window.supabase) { done(); return; }
    try {
      var sb = window.supabase.createClient(cfg.url, cfg.key, {
        auth: { persistSession:true, autoRefreshToken:false }
      });
      sb.auth.signOut().then(done).catch(done);
      setTimeout(done, 3500);                   // net band ho to bhi atak na jaye
    } catch (e) { done(); }
  });

  /* ---------- boot ---------- */
  var start = (location.hash || '').replace('#', '') || store(APP.key('tab')) || 'ledger';
  go(start, true);
})();
</script>
</body>
</html>
