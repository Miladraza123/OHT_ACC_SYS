name: Daily Backup

# Roz subah 6 baje Karachi ka waqt (UTC 01:00). GitHub UTC par chalta hai.
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:        # haath se bhi chala sakein

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install

      - name: Backup banao aur email karo
        run: node backup.js
        env:
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:  ${{ secrets.SUPABASE_ANON_KEY }}
          BACKUP_EMAIL:       ${{ secrets.BACKUP_EMAIL }}
          BACKUP_PASSWORD:    ${{ secrets.BACKUP_PASSWORD }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BACKUP_TO_EMAIL:    ${{ secrets.BACKUP_TO_EMAIL }}
